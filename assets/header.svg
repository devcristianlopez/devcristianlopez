<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-label="devcristianlopez - cyberpunk developer profile">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.45" stop-color="#B026FF"/>
      <stop offset="1" stop-color="#FF2A6D"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#FF2A6D" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF2A6D" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="600" cy="160" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B026FF" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#FF2A6D" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#05010D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#00F0FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glowText" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.55"/>
    </filter>
    <style>
      .mono { font-family: 'Courier New', Courier, monospace; }
      .hud {
        font-family: 'Courier New', Courier, monospace;
        font-size: 12px;
        letter-spacing: 3.4px;
        fill: #7DF9FF;
        fill-opacity: 0.72;
      }
      .hud-pink { fill: #FF2A6D; fill-opacity: 0.8; }
      .title {
        font-family: 'Courier New', Courier, monospace;
        font-size: 68px;
        font-weight: 700;
        letter-spacing: 10px;
      }
      .main { fill: #F2F7FF; filter: url(#glowText); }
      .ghost { opacity: 0.7; }
      .g1 { fill: #FF2A6D; animation: glitchA 3.4s infinite steps(1); }
      .g2 { fill: #00F0FF; animation: glitchB 2.9s infinite steps(1); }
      .subtitle {
        font-family: 'Courier New', Courier, monospace;
        font-size: 15px;
        letter-spacing: 5px;
        fill: #C9D1D9;
        fill-opacity: 0.88;
      }
      .scan { animation: scan 5.5s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .caret { animation: blink 1.05s steps(1) infinite; }
      .bar { animation: eq 1.8s ease-in-out infinite; transform-origin: bottom; }
      .bar2 { animation-delay: 0.3s; }
      .bar3 { animation-delay: 0.6s; }
      .bar4 { animation-delay: 0.9s; }
      .gridline { animation: drift 14s linear infinite; }

      @keyframes scan {
        0%   { transform: translateY(-40px); }
        100% { transform: translateY(360px); }
      }
      @keyframes glitchA {
        0%, 88%, 100% { transform: translate(0, 0); }
        89% { transform: translate(-5px, 3px); }
        91% { transform: translate(4px, -2px); }
        93% { transform: translate(-3px, -3px); }
        95% { transform: translate(2px, 2px); }
      }
      @keyframes glitchB {
        0%, 82%, 100% { transform: translate(0, 0); }
        83% { transform: translate(5px, -3px); }
        85% { transform: translate(-4px, 2px); }
        87% { transform: translate(3px, 3px); }
        89% { transform: translate(-2px, -2px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes eq {
        0%, 100% { transform: scaleY(0.35); }
        50% { transform: scaleY(1); }
      }
      @keyframes drift {
        0% { transform: translateY(0); }
        100% { transform: translateY(40px); }
      }
    </style>
  </defs>

  <!-- base -->
  <rect width="1200" height="340" fill="#05010D"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#halo)"/>

  <!-- moving grid pulse -->
  <g class="gridline" opacity="0.35">
    <rect x="0" y="20" width="1200" height="1" fill="url(#fade)"/>
    <rect x="0" y="140" width="1200" height="1" fill="url(#fade)" opacity="0.4"/>
    <rect x="0" y="260" width="1200" height="1" fill="url(#fade)" opacity="0.3"/>
  </g>

  <!-- HUD corners -->
  <g stroke="#00F0FF" stroke-opacity="0.65" stroke-width="1.5">
    <path d="M20 60V20H60"/>
    <path d="M1140 20H1180V60"/>
    <path d="M1180 280V320H1140"/>
    <path d="M60 320H20V280"/>
  </g>

  <!-- top hud -->
  <text class="hud" x="80" y="42">SYS://DEVELOPER.PROFILE</text>
  <text class="hud hud-pink" x="1120" y="42" text-anchor="end">NODE_07 // ONLINE</text>
  <circle cx="600" cy="38" r="3" fill="#00F0FF" class="pulse"/>

  <!-- title glitch -->
  <g class="title">
    <text class="ghost g1" x="600" y="182" text-anchor="middle">DEVCRISTIANLOPEZ</text>
    <text class="ghost g2" x="600" y="182" text-anchor="middle">DEVCRISTIANLOPEZ</text>
    <text class="main" x="600" y="182" text-anchor="middle">DEVCRISTIANLOPEZ</text>
  </g>

  <!-- subtitle -->
  <text class="subtitle" x="600" y="222" text-anchor="middle">BACKEND ARCHITECT  //  AI ORCHESTRATION  //  TECH INSTRUCTOR</text>

  <!-- animated equalizer -->
  <g opacity="0.85">
    <rect x="500" y="248" width="6" height="22" rx="2" fill="#00F0FF" class="bar"/>
    <rect x="514" y="248" width="6" height="22" rx="2" fill="#00F0FF" class="bar bar2"/>
    <rect x="528" y="248" width="6" height="22" rx="2" fill="#B026FF" class="bar bar3"/>
    <rect x="542" y="248" width="6" height="22" rx="2" fill="#FF2A6D" class="bar bar4"/>
  </g>

  <!-- bottom prompt -->
  <text class="hud" x="80" y="306">&gt; INITIALIZING NEURAL INTERFACE <tspan class="pulse">_</tspan></text>
  <rect x="406" y="296" width="7" height="14" fill="#00F0FF" class="caret"/>
  <text class="hud hud-pink" x="1120" y="306" text-anchor="end">[ OK ]</text>

  <!-- scanline -->
  <g class="scan">
    <rect x="0" y="0" width="1200" height="3" fill="url(#neon)" opacity="0.55"/>
    <rect x="0" y="0" width="1200" height="26" fill="url(#neon)" opacity="0.06"/>
  </g>

  <!-- frame -->
  <rect x="1" y="1" width="1198" height="338" stroke="url(#neon)" stroke-opacity="0.55" stroke-width="2" rx="6"/>
</svg>
